video:
  input_dir: data/videos
  output_dir: data/audio
  supported_formats:
    - .mp4
    - .mkv
    - .avi
    - .mov
    - .webm
  audio_settings:
    sample_rate: 16000
    channels: 1
    codec: pcm_s16le

speech:
  model_size: small
  device: cpu
  compute_type: int8
  beam_size: 1
  best_of: 1
  temperature: 0
  use_whisperx: true
  alignment: true
  vad_filter: true
  vad_min_silence_ms: 700
  restore_punctuation: true
  llm_correction: false

logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: video_transcriber.log
